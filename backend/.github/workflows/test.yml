name: Run Tests & Quality Checks

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.12 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Cache pip dependencies to make future workflow runs lightning fast
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Execute the pytest suite!
      - name: Run Pytest
        env:
          SECRET_KEY: "ci_pipeline_dummy_secret_key_for_testing_only"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@localhost:5432/fastapi_db"
        run: |
          pytest
