services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: statusforge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-statusforge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis (Caching + ARQ)
  redis:
    image: redis:7-alpine
    container_name: statusforge_redis
    restart: always
    ports:
      - "6379:6379"

  # FastAPI Backend
  web:
    build: ./backend
    container_name: statusforge_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-statusforge_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  # ARQ Background Worker (local multi-container development)
  worker:
    build: ./backend
    container_name: statusforge_worker
    restart: always
    volumes:
      - ./backend:/app
    command: arq app.worker.WorkerSettings
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-statusforge_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

  # Next.js Frontend
  frontend:
    image: node:20-alpine
    container_name: statusforge_frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - web
